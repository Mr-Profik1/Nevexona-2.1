name: Build ISO
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Опубликовать ISO в Releases"
        type: boolean
        default: false
      version:
        description: "Версия (например 0.3.0)"
        default: "0.3.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends live-build debootstrap git ca-certificates xorriso squashfs-tools
      - uses: actions/checkout@v4
      - name: Build
        run: ./scripts/build-iso.sh
      - name: Rename ISO
        if: always()
        run: |
          f=$(ls build/*.iso 2>/dev/null | head -1 || true)
          if [ -n "$f" ]; then mv "$f" "build/NEVEXONA-2.1-CORE-amd64.iso"; (cd build && sha256sum NEVEXONA-2.1-CORE-amd64.iso > NEVEXONA-2.1-CORE-amd64.iso.sha256); fi
      - name: Upload ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nevexona-core-iso
          path: |
            build/*.iso
            build/*.sha256
            build/SHA256SUMS
            build/build.log
          if-no-files-found: warn
      - name: Publish release
        if: ${{ inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: NEVEXONA 2.1 ${{ inputs.version }} (DEV)
          prerelease: true
          files: |
            build/NEVEXONA-2.1-CORE-amd64.iso
            build/NEVEXONA-2.1-CORE-amd64.iso.sha256
